$kind: http-request
description: >-
  Uniquement les archives ZIP nommées Sillage-version-architecture.zip présentes dans le répertoire de publication. Le
  nom technique historique reste stable malgré la marque Sillage.


  Effet : read. Les opérations d’écriture et les appels fournisseur sont volontaires ; ne pas lancer toute la collection
  sur son compte.
url: "{{base_url}}/macos/:archive"
method: GET
headers:
  Accept: application/json
pathVariables:
  archive: "{{archive}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test("Réponse réussie", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
    language: text/javascript
order: 5000
