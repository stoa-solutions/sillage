$kind: http-request
description: >-
  Programme une synchronisation idempotente. Lire ensuite les tâches et la liste de playlists pour vérifier
  l’achèvement. Ne pas appeler pour Mes découvertes, qui n’a pas de source YouTube.


  Effet : write. Les opérations d’écriture et les appels fournisseur sont volontaires ; ne pas lancer toute la
  collection sur son compte.
url: "{{base_url}}/v1/playlists/:id/sync"
method: POST
headers:
  Accept: application/json
pathVariables:
  id: "{{playlist_id}}"
scripts:
  - type: afterResponse
    code: pm.test("Réponse réussie", function () { pm.expect(pm.response.code).to.be.oneOf([202]); });
    language: text/javascript
order: 5000
