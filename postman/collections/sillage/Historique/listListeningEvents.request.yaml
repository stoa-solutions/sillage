$kind: http-request
description: >-
  Tri décroissant par playedAt et id. Pagination par curseur : reprendre playedAt et id de la dernière ligne dans before
  et beforeId. beforeId exige before. Valeur par défaut : 50 ; maximum : 200.


  Effet : read. Les opérations d’écriture et les appels fournisseur sont volontaires ; ne pas lancer toute la collection
  sur son compte.
url: "{{base_url}}/v1/history"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: limit
    value: "50"
    disabled: true
  - key: before
    value: "{{before}}"
    disabled: true
  - key: beforeId
    value: "{{beforeId}}"
    disabled: true
scripts:
  - type: afterResponse
    code: pm.test("Réponse réussie", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
    language: text/javascript
order: 2000
