$kind: http-request
description: >-
  Compte associé au jeton Bearer. Chaque session détermine son userId côté serveur ; un client ne peut pas choisir le
  compte d’un autre utilisateur.


  Effet : read. Les opérations d’écriture et les appels fournisseur sont volontaires ; ne pas lancer toute la collection
  sur son compte.
url: "{{base_url}}/v1/me"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: pm.test("Réponse réussie", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
    language: text/javascript
order: 1000
