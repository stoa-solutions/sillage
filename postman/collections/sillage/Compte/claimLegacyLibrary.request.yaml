$kind: http-request
description: >-
  Transfert à usage unique vers un compte Google, avec preuve du jeton historique. Transfère aussi l’historique et les
  jetons concernés. Ne sert pas à partager des bibliothèques entre comptes ordinaires.


  Effet : write. Les opérations d’écriture et les appels fournisseur sont volontaires ; ne pas lancer toute la
  collection sur son compte.
url: "{{base_url}}/v1/account/claim-library"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "legacyToken": "{{legacy_token}}"
    }
scripts:
  - type: afterResponse
    code: pm.test("Réponse réussie", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
    language: text/javascript
order: 3000
