$kind: http-request
description: >-
  Remplace le nom et les instructions d’un agent personnalisé du compte. Les agents de base ne sont pas modifiables.


  Effet : write. Les opérations d’écriture et les appels fournisseur sont volontaires ; ne pas lancer toute la
  collection sur son compte.
url: "{{base_url}}/v1/dj/agents/:id"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  id: "{{playlist_id}}"
body:
  type: json
  content: |-
    {
      "name": "Soirée calme",
      "instructions": "Réponses courtes. Pour une suite, reste sur des morceaux doux et évite les ruptures d’énergie."
    }
scripts:
  - type: afterResponse
    code: pm.test("Réponse réussie", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
    language: text/javascript
order: 3000
