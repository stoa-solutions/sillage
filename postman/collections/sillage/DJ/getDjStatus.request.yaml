$kind: http-request
description: >-
  Retourne les capacités configurées et le modèle sélectionné, sans jamais renvoyer la clé. personal distingue les
  réglages du compte du mode historique.


  Effet : read. Les opérations d’écriture et les appels fournisseur sont volontaires ; ne pas lancer toute la collection
  sur son compte.
url: "{{base_url}}/v1/dj/status"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: pm.test("Réponse réussie", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
