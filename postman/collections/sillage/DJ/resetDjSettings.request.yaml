$kind: http-request
description: >-
  Avec provider, supprime uniquement sa clé ; sans provider, supprime toutes les clés du compte courant. Aucun
  changement automatique de fournisseur après suppression. Le DJ d’un utilisateur Google sera à reconfigurer ; les
  playlists restent disponibles.


  Effet : write. Les opérations d’écriture et les appels fournisseur sont volontaires ; ne pas lancer toute la
  collection sur son compte.
url: "{{base_url}}/v1/dj/settings/reset"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "provider": "google"
    }
scripts:
  - type: afterResponse
    code: pm.test("Réponse réussie", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
    language: text/javascript
order: 4000
