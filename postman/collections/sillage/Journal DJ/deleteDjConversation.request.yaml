$kind: http-request
description: >-
  Effacement définitif de cette conversation du compte uniquement. Ne touche ni aux playlists, ni à l’historique
  d’écoute, ni à la clé Gemini. Les sauvegardes suivent leur propre rétention.


  Effet : write. Les opérations d’écriture et les appels fournisseur sont volontaires ; ne pas lancer toute la
  collection sur son compte.
url: "{{base_url}}/v1/dj/conversations/:conversationId"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  conversationId: "{{conversationId}}"
scripts:
  - type: afterResponse
    code: pm.test("Réponse réussie", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
    language: text/javascript
order: 6000
