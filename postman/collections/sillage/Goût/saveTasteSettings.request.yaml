$kind: http-request
description: >-
  De 1 à 60 jours. Ensuite, le poids du 👎 baisse de moitié à chaque nouveau délai.


  Effet : write. Les opérations d’écriture et les appels fournisseur sont volontaires ; ne pas lancer toute la
  collection sur son compte.
url: "{{base_url}}/v1/taste/settings"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "dislikeDays": 5
    }
scripts:
  - type: afterResponse
    code: pm.test("Réponse réussie", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
    language: text/javascript
order: 5000
