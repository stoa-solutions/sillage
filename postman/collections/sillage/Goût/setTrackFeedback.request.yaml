$kind: http-request
description: >-
  like remonte le titre dans les propositions du DJ. dislike l’écarte des propositions pendant le délai du compte (5
  jours par défaut), puis son poids s’estompe ; le titre reste jouable s’il est demandé par son nom. none retire l’avis.
  Aucune playlist n’est modifiée.


  Effet : write. Les opérations d’écriture et les appels fournisseur sont volontaires ; ne pas lancer toute la
  collection sur son compte.
url: "{{base_url}}/v1/taste/feedback/:videoId"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  videoId: "{{video_id}}"
body:
  type: json
  content: |-
    {
      "value": "like"
    }
scripts:
  - type: afterResponse
    code: pm.test("Réponse réussie", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
    language: text/javascript
order: 2000
