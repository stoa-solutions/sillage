$kind: http-request
description: >-
  Réservé au compte historique de maintenance. Relance les dernières tâches en échec sans dupliquer une tâche active.
  Opération globale de maintenance, pas une action de playlist ordinaire.


  Effet : write. Les opérations d’écriture et les appels fournisseur sont volontaires ; ne pas lancer toute la
  collection sur son compte.
url: "{{base_url}}/v1/jobs/retry"
method: POST
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: pm.test("Réponse réussie", function () { pm.expect(pm.response.code).to.be.oneOf([202]); });
    language: text/javascript
order: 2000
