$kind: http-request
description: >-
  Réservé aux vidéos présentes dans les playlists du compte. Cherche/cache LRCLIB et applique la correction personnelle.
  missing et unavailable sont des états métier en HTTP 200. Le clic temporel et le rendu restent gérés par le lecteur
  Mac.


  Effet : provider. Les opérations d’écriture et les appels fournisseur sont volontaires ; ne pas lancer toute la
  collection sur son compte.
url: "{{base_url}}/v1/lyrics/:videoId"
method: GET
headers:
  Accept: application/json
pathVariables:
  videoId: "{{video_id}}"
scripts:
  - type: afterResponse
    code: pm.test("Réponse réussie", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
    language: text/javascript
order: 1000
