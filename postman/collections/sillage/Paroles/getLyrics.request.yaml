$kind: http-request
description: >-
  Toute vidéo YouTube, dans la bibliothèque ou non. Sources dans l’ordre : LRCLIB (synchronisées), YouTube Music pour
  cette vidéo, lyrics.ovh ; résultat gardé pour tous les comptes (30 jours, 7 pour une absence). Le worker cherche à
  l’avance celles de la bibliothèque. Applique la correction personnelle. missing et unavailable sont des états métier
  en HTTP 200. 404 si le serveur ne sait pas quelle vidéo c’est.


  Effet : provider. Les opérations d’écriture et les appels fournisseur sont volontaires ; ne pas lancer toute la
  collection sur son compte.
url: "{{base_url}}/v1/lyrics/:videoId"
method: GET
headers:
  Accept: application/json
pathVariables:
  videoId: "{{video_id}}"
scripts:
  - type: afterResponse
    code: pm.test("Réponse réussie", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
    language: text/javascript
order: 1000
