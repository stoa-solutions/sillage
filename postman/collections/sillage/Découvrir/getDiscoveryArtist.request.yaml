$kind: http-request
description: >-
  Ses titres absents de la bibliothèque, ses voisins d’écoute ListenBrainz, les artistes avec qui il a enregistré
  (MusicBrainz), puis un pas plus loin. Gardé 20 minutes par compte et par artiste ; refresh=true tire d’autres
  artistes.


  Effet : provider. Les opérations d’écriture et les appels fournisseur sont volontaires ; ne pas lancer toute la
  collection sur son compte.
url: "{{base_url}}/v1/discover/artist?name={{name}}"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: name
    value: "{{name}}"
    disabled: false
  - key: refresh
    value: "{{refresh}}"
    disabled: true
scripts:
  - type: afterResponse
    code: pm.test("Réponse réussie", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
    language: text/javascript
order: 3000
