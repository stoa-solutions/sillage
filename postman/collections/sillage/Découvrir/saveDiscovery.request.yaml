$kind: http-request
description: >-
  Revérifie l’identifiant sur YouTube, enregistre dans la collection privée du compte, puis programme les index texte et
  image si activés. Ajout idempotent. Ne modifie aucune playlist YouTube. L’enrichissement MusicBrainz est ensuite pris
  en charge par le worker pour les comptes activés.


  Effet : write. Les opérations d’écriture et les appels fournisseur sont volontaires ; ne pas lancer toute la
  collection sur son compte.
url: "{{base_url}}/v1/discover/add"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "videoId": "{{video_id}}"
    }
scripts:
  - type: afterResponse
    code: pm.test("Réponse réussie", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
    language: text/javascript
order: 5000
