$kind: http-request
description: >-
  Artistes que MusicBrainz range dans ce genre et que la personne n’a pas encore, avec leurs titres. Mêmes exclusions et
  même budget de recherche que « Pour toi ». Gardé 20 minutes par compte et par scène ; refresh=true tire d’autres
  artistes.


  Effet : provider. Les opérations d’écriture et les appels fournisseur sont volontaires ; ne pas lancer toute la
  collection sur son compte.
url: "{{base_url}}/v1/discover/scene?genre={{genre}}"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: genre
    value: "{{genre}}"
    disabled: false
  - key: refresh
    value: "{{refresh}}"
    disabled: true
scripts:
  - type: afterResponse
    code: pm.test("Réponse réussie", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
    language: text/javascript
order: 2000
