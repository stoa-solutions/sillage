$kind: http-request
description: >-
  Rayons « Pour toi » : voisins d’écoute ListenBrainz des artistes préférés (Mon goût) et les plus écoutés, hors de tout
  artiste de la bibliothèque et des écoutes ; pour un artiste confidentiel, ses collaborations puis sa scène
  (MusicBrainz) ; un pas plus loin ; nouveaux titres des artistes récents. Écarte les vidéos possédées ou écoutées. Sans
  appel IA. Gardé 20 minutes par compte ; refresh=true tire d’autres voisins. scenes et artists : ce que la personne
  peut explorer ensuite.


  Effet : provider. Les opérations d’écriture et les appels fournisseur sont volontaires ; ne pas lancer toute la
  collection sur son compte.
url: "{{base_url}}/v1/discover/home"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: refresh
    value: "{{refresh}}"
    disabled: true
scripts:
  - type: afterResponse
    code: pm.test("Réponse réussie", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
    language: text/javascript
order: 1000
