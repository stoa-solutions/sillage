$kind: http-request
description: >-
  Les artistes de la bibliothèque (artiste principal de chaque titre), avec le nombre de titres, les écoutes du compte
  et la miniature du titre le plus écouté ; les plus écoutés d’abord.


  Effet : read. Les opérations d’écriture et les appels fournisseur sont volontaires ; ne pas lancer toute la collection
  sur son compte.
url: "{{base_url}}/v1/discover/artists"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: pm.test("Réponse réussie", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
    language: text/javascript
order: 4000
