$kind: http-request
description: >-
  Vérifie PostgreSQL et retourne la version ainsi que le SHA déployé. Ne valide pas à lui seul la progression du worker.


  Effet : read. Les opérations d’écriture et les appels fournisseur sont volontaires ; ne pas lancer toute la collection
  sur son compte.
url: "{{base_url}}/health"
method: GET
headers:
  Accept: application/json
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Réponse réussie", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      pm.test("Serveur disponible", function () { pm.expect(pm.response.json().ok).to.eql(true); });
    language: text/javascript
order: 1000
