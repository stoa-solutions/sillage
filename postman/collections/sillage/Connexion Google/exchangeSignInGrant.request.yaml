$kind: http-request
description: >-
  L’app échange le code Sillage reçu par son lien de retour et son verifier PKCE. Usage unique. Le jeton retourné est
  conservé dans le fichier privé de session du Mac ; le serveur conserve son empreinte. Validité 90 jours, prolongée à
  l’usage lorsque moins de 60 jours restent.


  Effet : write. Les opérations d’écriture et les appels fournisseur sont volontaires ; ne pas lancer toute la
  collection sur son compte.
url: "{{base_url}}/auth/exchange"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
auth:
  type: noauth
body:
  type: json
  content: |-
    {
      "code": "{{auth_code}}",
      "verifier": "{{pkce_verifier}}"
    }
scripts:
  - type: afterResponse
    code: pm.test("Réponse réussie", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
    language: text/javascript
order: 4000
