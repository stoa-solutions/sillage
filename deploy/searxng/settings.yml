# Private catalog lookup only; Recall handles authentication, caching and ownership.
# SEARXNG_SECRET is injected by Dokploy, never committed.
use_default_settings:
  engines:
    keep_only: [youtube]
server:
  limiter: false
  public_instance: false
  image_proxy: false
search:
  formats: [json]
outgoing:
  request_timeout: 12.0
  max_request_timeout: 15.0
engines:
  - name: youtube
    engine: youtube_noapi
    shortcut: yt
    timeout: 12.0
    disabled: false
