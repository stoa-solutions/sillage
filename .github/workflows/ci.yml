name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
      # Disposable service database only. Never use deployment credentials in CI.
      TEST_DATABASE_URL: postgres://postgres:sillage_test@localhost:5432/sillage_test
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: sillage_test
          POSTGRES_DB: sillage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sillage_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run test:integration
  node:
    runs-on: ubuntu-latest
    env:
      # CUDA binaries are downloaded at install time and unused here.
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run verify:node
  image:
    # The image Dokploy builds, started on an empty database exactly as in production.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: smoke_test
          POSTGRES_DB: smoke_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d smoke_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/server/Dockerfile -t sillage-server:${{ github.sha }} .
      - run: >-
          scripts/smoke-server-image.sh sillage-server:${{ github.sha }}
          postgres://postgres:smoke_test@host.docker.internal:5432/smoke_test
          ${{ github.sha }}
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Unsigned debug build and tests only; releases are signed locally by scripts/build-macos.py.
      - run: npm run verify:macos
