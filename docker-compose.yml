x-service: &service
  build:
    context: .
    dockerfile: apps/server/Dockerfile
  image: sillage:${RELEASE_SHA:-local}
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
x-config: &config
  DATABASE_URL: ${DATABASE_URL:?Database URL is required}
  INFERENCE_URL: http://inference:3002
  VISION_ENABLED: ${VISION_ENABLED:-true}
  SYNC_ENABLED: ${SYNC_ENABLED:-false}
  RELEASE_SHA: ${RELEASE_SHA:-local}
  MUSICBRAINZ_ACCOUNT_IDS: ${MUSICBRAINZ_ACCOUNT_IDS:-}
services:
  api:
    <<: *service
    environment:
      <<: *config
      PORT: 3001
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      SEARXNG_URL: ${SEARXNG_URL:-}
      PUBLIC_URL: ${PUBLIC_URL:-https://sillage.stoa.solutions}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      DJ_SETTINGS_ENCRYPTION_KEY: ${DJ_SETTINGS_ENCRYPTION_KEY:-}
      AI_GOOGLE_BASE_URL: ${AI_GOOGLE_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      AI_ANTHROPIC_BASE_URL: ${AI_ANTHROPIC_BASE_URL:-https://api.anthropic.com/v1}
      DJ_DAILY_REQUEST_LIMIT: ${DJ_DAILY_REQUEST_LIMIT:-100}
      DJ_ACCOUNT_DAILY_LIMITS: ${DJ_ACCOUNT_DAILY_LIMITS:-}
      MAC_RELEASES_DIR: /releases
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://sillage.stoa.solutions}
    volumes:
      - /srv/sillage/releases:/releases:ro
    mem_limit: 192m
    cpus: 0.5
    networks: [dokploy-network, data, inference, search]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
  searxng:
    labels:
      sillage.release: ${RELEASE_SHA:-local}
    image: searxng/searxng@sha256:23482d8ecf7ddf66029479468ea04c1bb11d2b65785a17a7e629e2ffd13296ca
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?SearXNG secret is required}
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    networks: [search]
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/healthz]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  worker:
    <<: *service
    command: [node, --enable-source-maps, dist/worker.js]
    environment:
      <<: *config
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      YOUTUBE_DAILY_BUDGET: 8000
      MUSICBRAINZ_PILOT_IDS: ${MUSICBRAINZ_PILOT_IDS:-}
    mem_limit: 192m
    cpus: 0.5
    stop_grace_period: 40s
    networks: [data, inference]
    depends_on:
      api:
        condition: service_healthy
  inference:
    <<: *service
    command: [node, --enable-source-maps, dist/inference.js]
    environment:
      VISION_ENABLED: ${VISION_ENABLED:-true}
      MODEL_THREADS: 2
      MODEL_PATH: /models/
      PORT: 3002
    volumes:
      - /srv/sillage/models:/models:ro
    mem_limit: 1408m
    cpus: 1.5
    networks: [inference]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  # No host ports or proxy attachment. Outbound internet is needed for YouTube.
  search:
    driver: bridge
  dokploy-network:
    external: true
  data:
    external: true
    name: sillage-data
  inference:
    internal: true
